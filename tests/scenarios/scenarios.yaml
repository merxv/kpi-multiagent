  expect:
    status: [failed]
    error_contains: слишком короткий

- id: S10
  title: Неподдерживаемый формат файла
  doc: data/test_docs/strategy_table.csv
  request: Сформируй KPI
  expected_result: Понятное сообщение «Неподдерживаемый формат» со списком допустимых форматов.
  expect:
    status: [failed]
    error_contains: Неподдерживаемый формат

- id: S11
  title: Файл не существует
  doc: data/test_docs/missing_strategy.txt
  request: Сформируй KPI
  expected_result: Понятное сообщение «Файл не найден».
  expect:
    status: [failed]
    error_contains: Файл не найден

- id: S12
  title: Модель недоступна (Ollama выключена)
  doc: data/sample_strategy.txt
  request: Сформируй KPI
  settings: {ollama_url: "http://127.0.0.1:9", llm_retries: 1}
  expected_result: >
    Понятное сообщение «Нет связи с Ollama», система не зависает, состояние и лог сохранены.
  expect:
    status: [failed]
    error_contains: Нет связи с Ollama
    state_saved: true
    max_elapsed_sec: 30

- id: S13
  title: Защита от зацикливания — лимит шагов
  doc: data/sample_strategy.txt
  request: Сформируй KPI до 2030 года
  settings: {max_steps: 12, max_goals: 4}
  expected_result: >
    Прогон останавливается на 13-м шаге со статусом stopped_by_limit и сообщением о лимите шагов;
    частичные результаты (цели, задачи) сохранены.
  expect:
    status: [stopped_by_limit]
    error_contains: лимит шагов
    max_steps: 13
    min_goals: 1
    state_saved: true

- id: S14
  title: Лимит времени выполнения
  doc: data/sample_strategy.txt
  request: Сформируй KPI до 2030 года
  settings: {max_runtime_sec: 8, max_goals: 4}
  expected_result: Прогон останавливается по лимиту времени с понятным сообщением, состояние сохранено.
  expect:
    status: [stopped_by_limit]
    error_contains: лимит времени
    state_saved: true
    max_elapsed_sec: 60

- id: S15
  title: Отключённые доработки (MAX_REVISIONS = 0)
  doc: data/sample_strategy.txt
  request: KPI до 2030 года по образованию и финансам
  settings: {max_goals: 2, max_revisions: 0}
  expected_result: >
    Цикл доработки не запускается: ни у одного KPI нет доработок, непрошедшие проверку KPI сразу
    получают статус «требует внимания».
  expect:
    status: [done]
    max_revisions: 0
    kpi_statuses_subset: [approved, needs_attention]
    min_kpis: 1
